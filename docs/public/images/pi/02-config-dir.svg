  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="490.0" y="25" text-anchor="middle" class="title">~/.pi/agent — Pi 配置目录</text>
  <text x="28" y="72" class="t" fill="#7ee787">$ mkdir -p ~/.pi/agent &amp;&amp; ls -la ~/.pi/agent</text>
  <text x="28" y="96" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="120" class="t" fill="#e6e6e6">total 40</text>
  <text x="28" y="144" class="t" fill="#e6e6e6">drwx------   9 you  staff   288 .</text>
  <text x="28" y="168" class="t" fill="#e6e6e6">drwx------   3 you  staff    96 ..</text>
  <text x="28" y="192" class="t" fill="#e6e6e6">-rw-------   1 you  staff     2 auth.json</text>
  <text x="28" y="216" class="t" fill="#e6e6e6">drwxr-xr-x   3 you  staff    96 bin</text>
  <text x="28" y="240" class="t" fill="#e6e6e6">-rw-------   1 you  staff  2147 models-store.json</text>
  <text x="28" y="264" class="t" fill="#e6e6e6">-rw-------   1 you  staff  2945 models.json   ← 主要改这个</text>
  <text x="28" y="288" class="t" fill="#e6e6e6">drwxr-xr-x   3 you  staff    96 sessions</text>
  <text x="28" y="312" class="t" fill="#e6e6e6">-rw-r--r--   1 you  staff   122 settings.json</text>
  <text x="28" y="336" class="t" fill="#e6e6e6">-rw-r--r--   1 you  staff    57 trust.json</text>
