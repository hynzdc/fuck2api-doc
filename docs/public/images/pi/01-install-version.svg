<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="346" viewBox="0 0 980 346" role="img" aria-label="Terminal — 安装并检查 Pi">
  <defs>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 14px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #c9d1d9; }
      .foot { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#1e1e1e"/>
  <rect width="100%" height="40" rx="10" fill="#2d2d2d"/>
  <rect y="20" width="100%" height="20" fill="#2d2d2d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="490.0" y="25" text-anchor="middle" class="title">Terminal — 安装并检查 Pi</text>
  <text x="28" y="72" class="t" fill="#7ee787">$ npm install -g --ignore-scripts @earendil-works/pi-coding-agent</text>
  <text x="28" y="96" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="120" class="t" fill="#e6e6e6">added 1 package in 3s</text>
  <text x="28" y="144" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="168" class="t" fill="#7ee787">$ pi --version</text>
  <text x="28" y="192" class="t" fill="#e6e6e6">0.84.1</text>
  <text x="28" y="216" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="240" class="t" fill="#7ee787">$ which pi</text>
  <text x="28" y="264" class="t" fill="#e6e6e6">/Users/you/.../pi</text>
  <rect y="312" width="100%" height="34" fill="#161b22"/>
  <text x="28" y="333" class="foot">安装完成后，终端应能直接运行 pi</text>
</svg>
