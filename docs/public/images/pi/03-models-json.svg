  <rect y="20" width="100%" height="20" fill="#2d2d2d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="490.0" y="25" text-anchor="middle" class="title">models.json — 接入 Fuck2API</text>
  <text x="28" y="72" class="t" fill="#7ee787">$ cat ~/.pi/agent/models.json</text>
  <text x="28" y="96" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="120" class="t" fill="#e6edf3">{</text>
  <text x="28" y="144" class="t" fill="#e6edf3">  &quot;providers&quot;: {</text>
  <text x="28" y="168" class="t" fill="#79c0ff">    &quot;fuck2api&quot;: {</text>
  <text x="28" y="192" class="t" fill="#79c0ff">      &quot;baseUrl&quot;: &quot;https://fxxkapi.top/v1&quot;,</text>
  <text x="28" y="216" class="t" fill="#e6edf3">      &quot;api&quot;: &quot;openai-completions&quot;,</text>
  <text x="28" y="240" class="t" fill="#ffa657">      &quot;apiKey&quot;: &quot;sk-********&quot;,</text>
  <text x="28" y="264" class="t" fill="#e6edf3">      &quot;authHeader&quot;: true,</text>
  <text x="28" y="288" class="t" fill="#e6edf3">      &quot;models&quot;: [</text>
  <text x="28" y="312" class="t" fill="#e6e6e6">        { &quot;id&quot;: &quot;gpt-5.6&quot;, &quot;name&quot;: &quot;GPT-5.6&quot;, ... },</text>
  <text x="28" y="336" class="t" fill="#e6e6e6">        { &quot;id&quot;: &quot;gpt-5.5&quot;, &quot;name&quot;: &quot;GPT-5.5&quot;, ... },</text>
  <text x="28" y="360" class="t" fill="#e6e6e6">        { &quot;id&quot;: &quot;claude-sonnet-4&quot;, &quot;name&quot;: &quot;Claude Sonnet 4&quot;, ... }</text>
  <text x="28" y="384" class="t" fill="#e6e6e6">      ]</text>
  <text x="28" y="408" class="t" fill="#e6edf3">    }</text>
  <text x="28" y="432" class="t" fill="#e6edf3">  }</text>
  <text x="28" y="456" class="t" fill="#e6edf3">}</text>
  <rect y="504" width="100%" height="34" fill="#161b22"/>
  <text x="28" y="525" class="foot">baseUrl 必须带 /v1；apiKey 填你的 Fuck2API 密钥</text>
