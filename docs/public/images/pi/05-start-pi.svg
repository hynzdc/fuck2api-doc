<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="538" viewBox="0 0 980 538" role="img" aria-label="Terminal — 启动 Pi 并指定模型">
  <defs>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; font-size: 14px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #c9d1d9; }
      .foot { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8b949e; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#1e1e1e"/>
  <rect width="100%" height="40" rx="10" fill="#2d2d2d"/>
  <rect y="20" width="100%" height="20" fill="#2d2d2d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="490.0" y="25" text-anchor="middle" class="title">Terminal — 启动 Pi 并指定模型</text>
  <text x="28" y="72" class="t" fill="#7ee787">$ cd ~/Projects/my-app</text>
  <text x="28" y="96" class="t" fill="#7ee787">$ pi --provider fuck2api --model gpt-5.6</text>
  <text x="28" y="120" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="144" class="t" fill="#79c0ff">pi  ·  fuck2api / gpt-5.6</text>
  <text x="28" y="168" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="192" class="t" fill="#e6e6e6">  Shortcuts: /hotkeys   Models: /model or Ctrl+L</text>
  <text x="28" y="216" class="t" fill="#e6e6e6">  Tools: read · write · edit · bash</text>
  <text x="28" y="240" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="264" class="t" fill="#e6e6e6">────────────────────────────────────────</text>
  <text x="28" y="288" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="312" class="t" fill="#e6e6e6">you › 你好，用一句话介绍你自己</text>
  <text x="28" y="336" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="360" class="t" fill="#e6e6e6">pi  › 我是 Pi，终端里的 coding agent，</text>
  <text x="28" y="384" class="t" fill="#e6e6e6">      当前通过 Fuck2API 调用 gpt-5.6。</text>
  <text x="28" y="408" class="t" fill="#e6e6e6"> </text>
  <text x="28" y="432" class="t" fill="#e6e6e6">────────────────────────────────────────</text>
  <text x="28" y="456" class="t" fill="#e6e6e6">~/Projects/my-app  ·  gpt-5.6  ·  ctx 2%</text>
  <rect y="504" width="100%" height="34" fill="#161b22"/>
  <text x="28" y="525" class="foot">交互界面里可用 /model 随时切换模型</text>
</svg>
